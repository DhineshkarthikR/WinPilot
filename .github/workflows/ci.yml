name: WinPilot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Module Manifest
        shell: powershell
        run: |
          Test-ModuleManifest -Path ./src/WinPilot.psd1

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Write-Host "Installing PSScriptAnalyzer for Windows PowerShell 5.1..."
            Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer -Force
          $violations = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./tests/PSScriptAnalyzerSettings.psd1
          if ($violations) {
            $violations | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer detected $($violations.Count) violation(s)."
            exit 1
          } else {
            Write-Host "PSScriptAnalyzer passed: 0 violations."
          }

      - name: Setup Compatible Pester
        shell: powershell
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [Version]'4.10.1' } | Select-Object -First 1
          if (-not $pester) {
            Write-Host "Installing Pester 4.10.1 for Windows PowerShell 5.1..."
            Install-Module -Name Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run Pester Unit Tests
        shell: powershell
        run: |
          $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [Version]'4.10.1' } | Select-Object -First 1
          if (-not $pester) {
            $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -lt 5 } | Sort-Object Version -Descending | Select-Object -First 1
          }
          Import-Module Pester -RequiredVersion $pester.Version -Force
          Write-Host "Using Pester version: $($pester.Version) under PowerShell $($PSVersionTable.PSVersion)"

          $testFiles = Get-ChildItem -Path "./tests/Unit" -Filter "*.Tests.ps1" | Select-Object -ExpandProperty FullName
          Write-Host "Discovered $($testFiles.Count) test files:"
          $testFiles | ForEach-Object { Write-Host "  - $_" }

          $res = Invoke-Pester -Script $testFiles -PassThru

          Write-Host ""
          Write-Host "================ TEST SUITE SUMMARY ================"
          Write-Host "Total Tests : $($res.TotalCount)"
          Write-Host "Passed      : $($res.PassedCount)"
          Write-Host "Failed      : $($res.FailedCount)"
          Write-Host "====================================================="

          if ($res.FailedCount -gt 0) {
            Write-Error "Test suite failed with $($res.FailedCount) failure(s)."
            exit 1
          }

  test-powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
